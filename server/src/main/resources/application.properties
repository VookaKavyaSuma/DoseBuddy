spring.application.name=dosebuddy

server.port=${PORT:8080}

# ===============================
# URLs & Origins (Externalized)
# ===============================
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,https://dose-buddy.vercel.app}
app.backend.base-url=${BACKEND_BASE_URL:http://localhost:8080}

# ===============================
# Security / JWT
# ===============================
jwt.secret=${JWT_SECRET:zZ/LAIQZUNKt48SKqV7/uuXNrBfouK5H7YiKttl0LyY=}

# ===============================
# Database Configuration
# ===============================
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool (prevents connection drops during cold start)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===============================
# AI & Vector Store Integrations
# ===============================
spring.ai.vertex.ai.gemini.project-id=${VERTEX_PROJECT_ID:dosebuddy-project}
spring.ai.vertex.ai.gemini.location=${VERTEX_LOCATION:us-central1}
# spring.ai.google.genai.api-key=${GOOGLE_API_KEY:}

spring.ai.vectorstore.pinecone.api-key=${PINECONE_API_KEY:}
spring.ai.vectorstore.pinecone.index-name=ai-rag-documents
spring.ai.vectorstore.pinecone.namespace=default