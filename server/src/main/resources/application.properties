spring.application.name=dosebuddy

server.port=${PORT:8080}

# URLs & Origins
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,https://dose-buddy.vercel.app}
app.backend.base-url=${BACKEND_BASE_URL:http://localhost:8080}

# JWT Configuration
jwt.secret=${JWT_SECRET:zZ/LAIQZUNKt48SKqV7/uuXNrBfouK5H7YiKttl0LyY=}

# MySQL Database Configuration
# The database 'dosebuddy_db' will be created automatically if it doesn't exist.
# Replace spring.datasource.password with your MySQL root password below or set the MYSQL_PASSWORD env variable.
# Use environment variables for cloud deployment
spring.datasource.url=${DB_URL:jdbc:mysql://dosebuddy-dosebuddy.d.aivencloud.com:25578/defaultdb?sslMode=REQUIRED}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Spring AI Vertex AI & Gemini Configuration
spring.ai.vertex.ai.gemini.project-id=dosebuddy-project
spring.ai.vertex.ai.gemini.location=us-central1
spring.ai.google.genai.api-key=${GOOGLE_API_KEY:}

# Pinecone Vector Store (Optional RAG Document Ingestion)
spring.ai.vectorstore.pinecone.api-key=${PINECONE_API_KEY:}
spring.ai.vectorstore.pinecone.index-name=ai-rag-documents
spring.ai.vectorstore.pinecone.namespace=default